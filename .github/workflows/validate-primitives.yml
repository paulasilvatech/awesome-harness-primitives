name: Validate primitives

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate primitives
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # Enforce harness rules and mandatory repository contracts for every primitive type.
      - name: Validate primitives
        run: python3 harness/github-copilot/scripts/validate_primitives.py --strict

      - name: Check normalized plugin manifests
        run: python3 harness/github-copilot/scripts/normalize_plugin_manifests.py --check

      - name: Check plugin marketplace audit
        run: python3 harness/github-copilot/scripts/audit_plugins.py --check

      - name: Check primitive content audit
        run: python3 harness/github-copilot/scripts/audit_primitive_content.py --check

      - name: Check agent and prompt capability audit
        run: python3 harness/github-copilot/scripts/audit_primitive_capabilities.py --check

      - name: Check primitive redundancy audit
        run: python3 harness/github-copilot/scripts/audit_primitive_redundancy.py --check

      # Prevent committed docs/CATALOG.md from drifting from repository contents.
      - name: Check catalog drift
        run: python3 harness/github-copilot/scripts/generate_catalog.py --check

      # Prevent plugin-local generated components from drifting from shared primitives.
      - name: Check plugin component drift
        run: python3 harness/github-copilot/scripts/sync_plugin_components.py --check

      # Prevent installed .github customizations and compatibility copies from drifting.
      - name: Check installed primitive drift
        run: python3 harness/github-copilot/scripts/sync_installed_primitives.py --check

  tests:
    name: Bundled script tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # Each file runs from its own directory: duplicate module names across
      # skill packages collide under a single unittest discovery root.
      - name: Run every bundled test file
        run: |
          set -euo pipefail
          export PYTHONPYCACHEPREFIX="${RUNNER_TEMP}/pycache"
          failed=0
          while IFS= read -r test_file; do
            echo "::group::${test_file}"
            if ! (cd "$(dirname "${test_file}")" \
                && python3 -m unittest "$(basename "${test_file}" .py)" -v); then
              failed=1
            fi
            echo "::endgroup::"
          done < <(find harness/github-copilot -name 'test_*.py' -type f | sort)
          exit "${failed}"

  links:
    name: External link audit (advisory)
    runs-on: ubuntu-latest
    # Network-dependent, so this reports but never blocks a merge.
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Audit external links
        run: |
          {
            echo "## External link audit"
            echo
            echo '```'
            python3 harness/github-copilot/scripts/check_links.py --only-problems || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
