name: Validate primitives

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate primitives
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Gates the build only on ERROR findings.
      - name: Validate primitives
        run: python3 scripts/validate_primitives.py

      # Advisory strict mode makes WARNING findings visible without failing PRs.
      - name: Strict validation advisory
        if: always()
        run: |
          {
            echo "## Strict validation advisory"
            echo
            echo '```'
            python3 scripts/validate_primitives.py --strict || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Prevent committed docs/CATALOG.md from drifting from repository contents.
      - name: Check catalog drift
        run: |
          python3 scripts/generate_catalog.py --out "$RUNNER_TEMP/CATALOG.md"
          diff -u docs/CATALOG.md "$RUNNER_TEMP/CATALOG.md"
