name: Validate primitives

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate primitives
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Enforce harness rules and mandatory repository contracts for every primitive type.
      - name: Validate primitives
        run: python3 library/scripts/validate_primitives.py --strict

      # Prevent committed docs/CATALOG.md from drifting from repository contents.
      - name: Check catalog drift
        run: python3 library/scripts/generate_catalog.py --check

      # Prevent plugin-local generated components from drifting from shared primitives.
      - name: Check plugin component drift
        run: python3 library/scripts/sync_plugin_components.py --check

      # Prevent installed .github customizations and compatibility copies from drifting.
      - name: Check installed primitive drift
        run: python3 library/scripts/sync_installed_primitives.py --check

  links:
    name: External link audit (advisory)
    runs-on: ubuntu-latest
    # Network-dependent, so this reports but never blocks a merge.
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit external links
        run: |
          {
            echo "## External link audit"
            echo
            echo '```'
            python3 library/scripts/check_links.py --only-problems || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
