name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install Azure CLI if missing
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v az >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y --no-install-recommends ca-certificates curl gnupg lsb-release
            curl -fsSL https://packages.microsoft.com/keys/microsoft.asc -o microsoft.asc
            fingerprint=$(gpg --show-keys --with-colons microsoft.asc | awk -F: '/^fpr:/ {print $10; exit}')
            if [ "$fingerprint" != "BC528686B50D79E339D3721CEB3E94ADBE1229CF" ]; then
              echo "Unexpected Microsoft package signing key fingerprint: $fingerprint" >&2
              exit 1
            fi
            gpg --dearmor -o packages.microsoft.gpg microsoft.asc
            sudo install -o root -g root -m 644 packages.microsoft.gpg /usr/share/keyrings/microsoft-packages.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/microsoft-packages.gpg] https://packages.microsoft.com/repos/azure-cli/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/azure-cli.list >/dev/null
            sudo apt-get update -y
            sudo apt-get install -y --no-install-recommends azure-cli
          fi
          az version --output table

      - name: Install Terraform CLI
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends gnupg software-properties-common
          wget -O- https://apt.releases.hashicorp.com/gpg | gpg --dearmor | sudo tee /usr/share/keyrings/hashicorp-archive-keyring.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list >/dev/null
          sudo apt-get update -y
          sudo apt-get install -y terraform
          terraform version

      - name: Install kubectl
        shell: bash
        run: |
          set -euo pipefail
          az aks install-cli
          kubectl version --client=true

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Verify platform toolchain
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          az version --query '"azure-cli"' --output tsv
          terraform version
          kubectl version --client=true
          helm version --short
