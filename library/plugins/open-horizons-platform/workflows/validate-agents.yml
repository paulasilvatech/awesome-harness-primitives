name: Validate Agents

on:
  push:
    paths:
      - ".github/agents/**"
      - ".github/prompts/**"
      - ".github/skills/**/SKILL.md"
      - ".github/instructions/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/skills/validation-scripts/scripts/validate-agents.py"
      - ".github/copilot-instructions.md"
      - "AGENTS.md"
      - ".github/mcp.json"
      - ".github/hooks/**"
      - ".github/copilot/**"
      - "golden-paths/common/agents/**"
  pull_request:
    paths:
      - ".github/agents/**"
      - ".github/prompts/**"
      - ".github/skills/**/SKILL.md"
      - ".github/instructions/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/skills/validation-scripts/scripts/validate-agents.py"
      - ".github/copilot-instructions.md"
      - "AGENTS.md"
      - ".github/mcp.json"
      - ".github/hooks/**"
      - ".github/copilot/**"
      - "golden-paths/common/agents/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@a26af69be951a213d495a4c3e4e4022e16d87065 # v4

      - name: Set up Python
        uses: actions/setup-python@11d5960a326750d5838078e36cf38b85af677262 # v5
        with:
          python-version: "3.11"

      - name: Install validator dependencies
        run: python -m pip install pyyaml

      - name: Run Validation Script
        run: |
          chmod +x .github/skills/validation-scripts/scripts/validate-agents.py
          ./.github/skills/validation-scripts/scripts/validate-agents.py --strict

      - name: Validate optional Copilot JSON config
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .github/mcp.json ]]; then
            python -m json.tool .github/mcp.json >/dev/null
          fi
          shopt -s nullglob
          for file in .github/hooks/*.json; do
            python -m json.tool "$file" >/dev/null
          done
