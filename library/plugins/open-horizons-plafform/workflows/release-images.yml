name: release-images

# Builds and publishes Open Horizons container images to GHCR.
# Triggered by version tags (vX.Y.Z) or manually via workflow_dispatch.
# Images are published as PUBLIC under ghcr.io/ohorizons/*.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. v7.2.3 or v7.2.3-rc1)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: build ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: ohorizons-backstage
            context: backstage
            dockerfile: backstage/Dockerfile.acr
          - name: ohorizons-agent-api
            context: backstage/server/agent-api
            dockerfile: backstage/server/agent-api/Dockerfile
          - name: ohorizons-agent-api-impact
            context: backstage/server/agent-api-impact
            dockerfile: backstage/server/agent-api-impact/Dockerfile
          - name: ohorizons-agent-api-maf
            context: backstage/server/agent-api-maf
            dockerfile: backstage/server/agent-api-maf/Dockerfile
          - name: ohorizons-agent-api-sk
            context: backstage/server/agent-api-sk
            dockerfile: backstage/server/agent-api-sk/Dockerfile
          - name: mcp-ecosystem
            context: mcp-servers
            dockerfile: mcp-servers/Dockerfile
          - name: ohorizons-foundry-agents
            context: foundry/agents-service
            dockerfile: foundry/agents-service/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set image owner
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js (Backstage only)
        if: matrix.image.name == 'ohorizons-backstage'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Build Backstage bundle
        if: matrix.image.name == 'ohorizons-backstage'
        working-directory: backstage
        run: |
          corepack enable
          yarn install --immutable
          yarn tsc
          yarn build:backend

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/${{ matrix.image.name }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image.name }}
            org.opencontainers.image.description=Open Horizons — Agentic DevOps Platform
            org.opencontainers.image.source=https://github.com/Ohorizons/open-horizons-platform
            org.opencontainers.image.url=https://ohorizons.ai
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.vendor=Open Horizons

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,scope=${{ matrix.image.name }},mode=max

      - name: Generate build attestation
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/${{ matrix.image.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign image with cosign (keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/${{ matrix.image.name }}@${{ steps.build.outputs.digest }}

      - name: Scan image with Trivy
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/${{ matrix.image.name }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-${{ matrix.image.name }}.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Report Trivy image scan result
        if: steps.trivy.outcome == 'failure'
        run: |
          echo "::warning::Trivy found CRITICAL/HIGH image findings for ${{ matrix.image.name }}. The image was published, signed, and SARIF upload will run; review the Security tab before production promotion."

      - name: Upload Trivy results to Security tab
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.image.name)) != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        with:
          sarif_file: trivy-${{ matrix.image.name }}.sarif
          category: trivy-${{ matrix.image.name }}

  summary:
    name: summary
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Write summary
        run: |
          {
            echo "## Open Horizons release-images"
            echo ""
            echo "Tag: \`${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}\`"
            echo "Owner: \`${GITHUB_REPOSITORY_OWNER,,}\`"
            echo ""
            echo "| Image | Pull command |"
            echo "|---|---|"
            for img in ohorizons-backstage ohorizons-agent-api ohorizons-agent-api-impact ohorizons-agent-api-maf ohorizons-agent-api-sk mcp-ecosystem ohorizons-foundry-agents; do
              echo "| \`$img\` | \`docker pull ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$img:${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
